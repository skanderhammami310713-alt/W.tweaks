<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.Tweaks | Discord Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #06080d;
            --card-bg: rgba(15, 19, 29, 0.6);
            --accent-blue: #0088ff;
            --accent-glow: rgba(0, 136, 255, 0.35);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 136, 255, 0.12) 0%, transparent 60%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .logo {
            font-size: 40px;
            font-weight: 900;
            font-style: italic;
            color: var(--accent-blue);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
        }

        .btn-discord {
            background: #5865F2;
            color: #fff;
            width: 100%;
            padding: 13px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
            text-decoration: none;
        }

        .btn-discord:hover {
            background: #4752C4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        .btn-discord svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">W</div>
        <h1>Authentication</h1>
        <p id="status-msg">Connect with Discord to sync your profile</p>
        
        <button class="btn-discord" id="loginBtn" onclick="startDiscordLogin()">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22c2.68-27.12-5.76-50.8-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Authorize with Discord
        </button>
    </div>

    <script>
        const CLIENT_ID = '1539275680716554340';
        const REDIRECT_URI = 'https://w-tweaks.wtweaks.workers.dev/login.html';

        function startDiscordLogin() {
            const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = discordAuthUrl;
        }

        window.onload = async function() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                document.getElementById('status-msg').innerText = "Logging you in...";
                document.getElementById('loginBtn').style.display = 'none';

                try {
                    const response = await fetch('https://discord.com/api/users/@me', {
                        headers: {
                            authorization: `Bearer ${accessToken}`,
                        },
                    });
                    const userData = await response.json();

                    if (userData.id) {
                        if (window.opener) {
                            window.opener.postMessage({
                                id: userData.id,
                                username: userData.username,
                                avatar: userData.avatar
                            }, "*");
                            window.close();
                        } else {
                            document.getElementById('status-msg').innerText = "Successfully logged in as " + userData.username + "!";
                        }
                    } else {
                        document.getElementById('status-msg').innerText = "Failed to fetch profile.";
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById('status-msg').innerText = "Authentication error occurred.";
                }
            }
        };
    </script>
</body>
</html>
